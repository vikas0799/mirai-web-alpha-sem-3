<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    /* Basic reset for page */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: rgb(246, 237, 227); /* Page ka background color */
        padding: 40px 20px;
    }

    #product-container {
        width: 100%;
        max-width: 1200px; /* Badi screens par zyada failne se rokne ke liye */
        margin: 0 auto;    /* Center align karne ke liye */
        display: flex;
        justify-content: center;
        align-items: stretch; /* Cards ki height barabar rakhne ke liye */
        flex-wrap: wrap;
        gap: 30px;
    }

    .product-card {
        background-color: #ffffff;
        width: 280px; /* Card ki fixed width */
        padding: 20px;
        border-radius: 12px; /* Gol kinare */
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05); /* Halki parchai */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease; /* Hover animation */
    }

    /* Hover karne par card thoda upar uthega */
    .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
    }

    /* Image styling */
    .product-card img {
        width: 100%;
        height: 180px;
        object-fit: contain; /* Image aspect ratio kharab nahi hoga */
        margin-bottom: 20px;
    }

    /* Category text */
    .product-card .category {
        font-size: 0.75rem;
        text-transform: uppercase;
        color: #888;
        letter-spacing: 1px;
        margin-bottom: 5px;
        align-self: flex-start; /* Left align */
    }

    /* Title styling */
    .product-card h3 {
        font-size: 1.1rem;
        color: #333;
        text-align: left;
        width: 100%;
        margin-bottom: 10px;
        line-height: 1.3;
    }

    /* Description text */
    .product-card .desc {
        font-size: 0.85rem;
        color: #666;
        text-align: left;
        width: 100%;
        margin-bottom: 15px;
        line-height: 1.4;
        flex-grow: 1; /* Space barabar cover karne ke liye */
    }

    /* Price tag */
    .product-card .price {
        font-size: 1.3rem;
        font-weight: bold;
        color: #27ae60; /* Green color */
        align-self: flex-start;
        margin-bottom: 15px;
    }

    /* Rating pill */
    .product-card .rating {
        background-color: #fff3cd;
        color: #856404;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: bold;
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 5px;
    }
</style>
</head>
<body>
